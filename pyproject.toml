[project]
name = "olist-pipeline"
version = "0.1.0"
description = "Pipeline de dados da Olist: do CSV ao dashboard, com DuckDB."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "streamlit>=1.30",
    "plotly>=5.18",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = ["test/*", "app.py", "ui.py", ".venv/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
